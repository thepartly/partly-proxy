[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/partly/api-proxy"
authors = ["Partly <jo@partly.com>"]
rust-version = "1.75"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }

# HTTP
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
http = "1"
http-body = "1"
http-body-util = "0.1"
bytes = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"

# Hashing
sha2 = "0.10"
hex = "0.4"

# IDs / time
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", default-features = false, features = ["serde", "std", "clock"] }

# Errors / traits
thiserror = "1"
async-trait = "0.1"

# Async stream plumbing — used by the SnapshotStorage trait surface and
# its backends.
futures = "0.3"
async-stream = "0.3"

# SQLite backend uses sqlx for native-async DB access. Runtime queries
# only (no `macros` feature) so consumers don't need a provisioned
# DATABASE_URL during cargo build.
sqlx = { version = "0.8", default-features = false, features = ["sqlite", "runtime-tokio"] }

# Object-storage backend: Apache Arrow's object_store crate covers
# S3 (and S3-compatible Minio) plus GCS natively.
object_store = { version = "0.11", default-features = false, features = ["aws", "gcp"] }
parking_lot = "0.12"

# Matching
regex = "1"

# TLS
rustls = "0.23"
rustls-pemfile = "2"
tokio-rustls = "0.26"
webpki-roots = "1"
rustls-native-certs = "0.8"
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "http2", "tls12", "webpki-tokio", "ring"] }

# Test utilities
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
tempfile = "3"
rcgen = "0.13"

[profile.dev]
opt-level = 0

[profile.release]
opt-level = 3
lto = "thin"
