[package]
name = "partly-proxy-lib"
description = "Programmable HTTP/HTTPS proxy library for integration testing: record, replay, stub, intercept."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
readme = "README.md"
keywords = ["proxy", "http", "testing", "record", "replay"]
categories = ["development-tools::testing", "network-programming"]

[features]
# `storage-jsonl` is in the default set so callers that pass
# `RecordingConfig::persisted(path)` get NDJSON persistence with zero
# extra configuration. Opt out via `default-features = false` to keep
# the dependency closure minimal.
default = ["storage-jsonl"]
storage-jsonl = ["dep:partly-proxy-storage-jsonl"]
storage-sqlite = ["dep:partly-proxy-storage-sqlite"]
testing = []

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
return_self_not_must_use = "allow"
needless_pass_by_value = "allow"
similar_names = "allow"
too_many_lines = "allow"
struct_field_names = "allow"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
# Shared type surface (SnapshotStorage trait, RecordedExchange, ProxyError).
# Re-exported under the original module paths via the shim files in
# src/{error,recorded,storage}.rs so callers see no API change.
partly-proxy-types = { workspace = true }

# Optional backend deps. Each crate is also usable standalone — pulling
# them in here just makes them accessible as `partly_proxy_lib::jsonl`
# etc., and lets `Recorder::new` open the default JSONL backend when
# the matching feature is on.
partly-proxy-storage-jsonl = { workspace = true, optional = true }
partly-proxy-storage-sqlite = { workspace = true, optional = true }

tokio = { workspace = true }
tokio-util = { workspace = true, features = ["rt"] }
bytes = { workspace = true }
http = { workspace = true }
http-body = { workspace = true }
http-body-util = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
hyper-rustls = { workspace = true }
rustls = { workspace = true }
rustls-pemfile = { workspace = true }
tokio-rustls = { workspace = true }
webpki-roots = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
regex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
base64 = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tempfile = { workspace = true }
reqwest = { workspace = true, features = ["http2"] }
bytes = { workspace = true }
rcgen = { workspace = true }
tracing-subscriber = { workspace = true }
partly-proxy-echo = { workspace = true }
# Benches exercise both first-party storage backends through the full
# proxy pipeline. JSONL is already enabled via the default feature set;
# SQLite is pulled in as a dev-dep directly so the benches can construct
# `SqliteStorage` without needing the `storage-sqlite` feature on.
partly-proxy-storage-jsonl = { workspace = true }
partly-proxy-storage-sqlite = { workspace = true }
criterion = { workspace = true }

[[example]]
name = "host"
path = "examples/host.rs"

[[bench]]
name = "throughput"
harness = false

[[bench]]
name = "latency"
harness = false

[[bench]]
name = "large_body"
harness = false
