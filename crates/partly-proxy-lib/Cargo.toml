[package]
name = "partly-proxy-lib"
description = "Programmable HTTP/HTTPS proxy library for integration testing: record, replay, stub, intercept."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
readme = "README.md"
keywords = ["proxy", "http", "testing", "record", "replay"]
categories = ["development-tools::testing", "network-programming"]

[features]
# `storage-jsonl` is in the default set so callers that pass
# `RecordingConfig::persisted(path)` get NDJSON persistence with zero
# extra configuration. Opt out via `default-features = false` to keep
# the dependency closure minimal.
default = ["storage-jsonl"]
storage-jsonl = ["dep:partly-proxy-storage-jsonl"]
storage-sqlite = ["dep:partly-proxy-storage-sqlite"]
testing = []

# OpenTelemetry support. One feature per `opentelemetry` minor version so
# the lib can track multiple minors side-by-side as the OTEL Rust stack
# evolves. Enable at most one at a time — `lib.rs` enforces this with a
# `compile_error!`.
#
# The library does *not* install a tracer provider, propagator, exporter,
# or `tracing-subscriber`. The host binary is responsible for that. The
# feature only wires the lib's extraction / injection / span helpers.
#
# `_otel_any` is an internal alias enabled by every version feature so
# cfg gates inside the crate stay version-agnostic. Do not enable it
# directly.
_otel_any = []
otel_0_27 = [
    "_otel_any",
    "dep:opentelemetry_0_27",
    "dep:opentelemetry-http_0_27",
    "dep:opentelemetry-semantic-conventions_0_27",
    "dep:tracing-opentelemetry_0_28",
]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
return_self_not_must_use = "allow"
needless_pass_by_value = "allow"
similar_names = "allow"
too_many_lines = "allow"
struct_field_names = "allow"

[dependencies]
# Shared type surface (SnapshotStorage trait, RecordedExchange, ProxyError).
# Re-exported under the original module paths via the shim files in
# src/{error,recorded,storage}.rs so callers see no API change.
partly-proxy-types = { path = "../partly-proxy-types" }

# Optional backend deps. Each crate is also usable standalone — pulling
# them in here just makes them accessible as `partly_proxy_lib::jsonl`
# etc., and lets `Recorder::new` open the default JSONL backend when
# the matching feature is on.
partly-proxy-storage-jsonl = { path = "../partly-proxy-storage-jsonl", optional = true }
partly-proxy-storage-sqlite = { path = "../partly-proxy-storage-sqlite", optional = true }

tokio = { workspace = true }
tokio-util = { workspace = true, features = ["rt"] }
bytes = { workspace = true }
http = { workspace = true }
http-body = { workspace = true }
http-body-util = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
hyper-rustls = { workspace = true }
rustls = { workspace = true }
rustls-pemfile = { workspace = true }
tokio-rustls = { workspace = true }
webpki-roots = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
regex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
base64 = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }

# OpenTelemetry — optional, version-suffixed. The active set is selected
# by the `otel_0_*` feature flags above. None of these are linked unless
# a version feature is enabled.
opentelemetry_0_27 = { workspace = true, optional = true }
opentelemetry-http_0_27 = { workspace = true, optional = true }
opentelemetry-semantic-conventions_0_27 = { workspace = true, optional = true }
tracing-opentelemetry_0_28 = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tempfile = { workspace = true }
reqwest = { workspace = true, features = ["http2"] }
bytes = { workspace = true }
rcgen = { workspace = true }
tracing-subscriber = { workspace = true }
partly-proxy-echo = { path = "../partly-proxy-echo" }

# Test-only OTEL SDK for the integration tests' in-memory span exporter.
# `opentelemetry_0_27` itself reaches the test crate through the optional
# regular dep when the matching feature is enabled, so it isn't repeated
# here.
opentelemetry_sdk_0_27 = { workspace = true }

[[example]]
name = "host"
path = "examples/host.rs"
