[package]
name = "partly-proxy-lib"
description = "Programmable HTTP/HTTPS proxy library for integration testing: record, replay, stub, intercept."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
readme = "README.md"
keywords = ["proxy", "http", "testing", "record", "replay"]
categories = ["development-tools::testing", "network-programming"]

[features]
# `storage-jsonl` on by default preserves source-compat for callers that
# rely on `RecordingConfig::persisted(...)` to write NDJSON — see
# .scratch/MULTI_BACKEND_IMPLEMENTATION.md slice 2.
default = ["storage-jsonl"]
storage-jsonl = ["dep:partly-proxy-storage-jsonl"]
# `storage-sqlite` + `storage-object` slots are reserved for slices 6 / 7.
# Listed as feature names with no `dep:` line until the crates land — that
# way callers can already write `features = ["storage-sqlite"]` in advance
# without breaking; the no-op feature toggles a `cfg` flag but pulls in
# nothing. Slice 6/7 add the `dep:` line.
storage-sqlite = []
storage-object = []
testing = []

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
return_self_not_must_use = "allow"
needless_pass_by_value = "allow"
similar_names = "allow"
too_many_lines = "allow"
struct_field_names = "allow"

[dependencies]
# Shared type surface (SnapshotStorage trait, RecordedExchange, ProxyError).
# Re-exported under the original module paths via the shim files in
# src/{error,recorded,storage}.rs so callers see no API change.
partly-proxy-types = { path = "../partly-proxy-types" }

# Optional backend deps. Each crate is also usable standalone — pulling
# them in here just makes them accessible as `partly_proxy_lib::jsonl`
# etc., and lets `Recorder::new` open the default JSONL backend when
# the matching feature is on.
partly-proxy-storage-jsonl = { path = "../partly-proxy-storage-jsonl", optional = true }

tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
http-body = { workspace = true }
http-body-util = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
hyper-rustls = { workspace = true }
rustls = { workspace = true }
rustls-pemfile = { workspace = true }
tokio-rustls = { workspace = true }
webpki-roots = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
regex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
base64 = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tempfile = { workspace = true }
reqwest = { workspace = true }
bytes = { workspace = true }
rcgen = { workspace = true }
tracing-subscriber = { workspace = true }
partly-proxy-echo = { path = "../partly-proxy-echo" }

[[example]]
name = "host"
path = "examples/host.rs"
