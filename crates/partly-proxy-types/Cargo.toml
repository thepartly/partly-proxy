[package]
name = "partly-proxy-types"
description = "Shared type interfaces (SnapshotStorage trait, RecordedExchange, ProxyError) for the partly-proxy ecosystem. Depended on by partly-proxy-lib and every storage backend crate."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true

[features]
# Conformance suite for backend authors. Opt-in via dev-deps:
#   partly-proxy-types = { path = "...", features = ["testing"] }
testing = []

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"

[dependencies]
async-trait = { workspace = true }
base64 = { workspace = true }
bytes = { workspace = true }
chrono = { workspace = true }
futures = { workspace = true }
hex = { workspace = true }
http = { workspace = true }
serde = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
