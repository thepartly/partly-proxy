[package]
name = "partly-proxy-storage-jsonl"
description = "NDJSON SnapshotStorage backend for partly-proxy-lib."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"

[dependencies]
# `default-features = false` is load-bearing here: without it, depending
# on partly-proxy-lib would re-enable its `storage-jsonl` feature, which
# turns the optional dep on *this* crate back on — a feature cycle that
# Cargo can detect and refuse to resolve. We only need the trait, the
# error type, and the RecordedExchange serde plumbing from the lib; none
# of those are gated.
partly-proxy-lib = { path = "../partly-proxy-lib", default-features = false }
async-trait = { workspace = true }
async-stream = { workspace = true }
futures = { workspace = true }
tokio = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
