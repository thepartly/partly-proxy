[package]
name = "partly-proxy-storage-jsonl"
description = "NDJSON SnapshotStorage backend for partly-proxy-lib."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"

[dependencies]
# Depend on the types crate, NOT on partly-proxy-lib — depending on the
# lib would create a Cargo package-graph cycle since the lib has an
# optional dep on this crate. Cycle detection is package-level, not
# feature-level, so even `default-features = false` wouldn't break it.
# The types crate carries the trait + RecordedExchange + ProxyError —
# everything this backend needs to be a valid SnapshotStorage impl.
partly-proxy-types = { path = "../partly-proxy-types" }
async-trait = { workspace = true }
async-stream = { workspace = true }
futures = { workspace = true }
tokio = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
partly-proxy-types = { path = "../partly-proxy-types" }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
