[package]
name = "partly-proxy-storage-object"
description = "Object-store (S3 / GCS / Minio) SnapshotStorage backend for partly-proxy-lib."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"

[dependencies]
partly-proxy-types = { path = "../partly-proxy-types" }
object_store = { workspace = true }
async-trait = { workspace = true }
async-stream = { workspace = true }
bytes = { workspace = true }
futures = { workspace = true }
parking_lot = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
partly-proxy-types = { path = "../partly-proxy-types", features = ["testing"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
http = { workspace = true }
bytes = { workspace = true }
