[package]
name = "partly-proxy-storage-sqlite"
description = "SQLite-backed SnapshotStorage backend for partly-proxy-lib."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"

[dependencies]
# Trait + RecordedExchange + ProxyError come from the types crate;
# depending on it here keeps the SQLite backend usable without pulling
# in partly-proxy-lib's heavy transitive deps (hyper, rustls, …).
partly-proxy-types = { workspace = true }
sqlx = { workspace = true }
async-trait = { workspace = true }
async-stream = { workspace = true }
futures = { workspace = true }
tokio = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
partly-proxy-types = { workspace = true, features = ["testing"] }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
